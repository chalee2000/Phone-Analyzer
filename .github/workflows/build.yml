name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -o addopts=""
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

  agent:
    name: Android helper app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Gradle 8.11.1 (with retries)
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build APK (retries on transient download errors)
        run: |
          for attempt in 1 2 3; do
            gradle -p android-agent assembleDebug --no-daemon && exit 0
            echo "Gradle attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Collect APK
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk spni-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spni-agent
          path: spni-agent.apk

  windows:
    name: Windows app
    needs: [test, agent]
    # Build even if the helper APK failed; the app then runs without it.
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spni-agent
          path: resources/agent
      - name: Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath resources -Force
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Python packages
        run: pip install -e ".[dev]"
      - name: Smoke test (demo extraction + reports)
        run: pytest -o addopts="" tests/test_pipeline.py
      - name: PyInstaller
        run: pyinstaller spni.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: Phone-Analysis-windows
          path: dist/Phone Analysis
      # Drive the packaged app in its real WebView2 window and check that photos render.
      - name: UI check in the real window (WebView2)
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install "websocket-client>=1.6"
          python scripts/ui_check.py "dist/Phone Analysis/Phone Analysis.exe" ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: ui-check
          if-no-files-found: ignore
